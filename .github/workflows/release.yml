name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # --publish never keeps electron-builder from opening a GitHub release.
      # This workflow uploads the artifacts to a draft with the built-in token.
      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never

      - name: Write installer SHA256
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "TimeKeeper-Setup-*.exe" |
            Where-Object { $_.Name -notlike "*.blockmap" } |
            Select-Object -First 1
          if (-not $exe) { throw "Windows installer was not produced" }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLower()
          $shaPath = Join-Path $exe.DirectoryName ($exe.Name + ".sha256")
          Set-Content -Path $shaPath -Value "$hash  $($exe.Name)" -Encoding ascii
          Write-Host "Wrote $shaPath"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/TimeKeeper-Setup-*.exe
            release/latest.yml
            release/TimeKeeper-Setup-*.exe.blockmap
            release/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
